name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for commit count
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Calculate version from git
      id: version
      run: |
        $commitCount = git rev-list --count HEAD
        $version = "1.0.$commitCount"
        $gitHash = git rev-parse --short HEAD
        $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
        
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "GIT_HASH=$gitHash" >> $env:GITHUB_OUTPUT
        echo "BUILD_DATE=$buildDate" >> $env:GITHUB_OUTPUT
        
        Write-Host "Version: $version"
        Write-Host "Git Hash: $gitHash"
    
    - name: Update version files
      run: |
        # Update version.py
        $versionContent = @"
        """
        Version information for IntelAvatar.
        This file is auto-generated by the build script.
        """
        
        __version__ = "${{ steps.version.outputs.VERSION }}"
        BUILD_DATE = "${{ steps.version.outputs.BUILD_DATE }}"
        GIT_HASH = "${{ steps.version.outputs.GIT_HASH }}"
        GIT_BRANCH = "main"
        "@
        
        Set-Content -Path "configs/version.py" -Value $versionContent -Encoding UTF8
        
        # Update version_info.txt
        $version = "${{ steps.version.outputs.VERSION }}"
        $gitHash = "${{ steps.version.outputs.GIT_HASH }}"
        $buildDate = "${{ steps.version.outputs.BUILD_DATE }}"
        $versionParts = $version -split '\.'
        $major = $versionParts[0]
        $minor = $versionParts[1]
        $patch = if ($versionParts.Length -gt 2 -and $versionParts[2]) { $versionParts[2] } else { "0" }
        
        $versionInfoContent = @"
        # UTF-8
        VSVersionInfo(
          ffi=FixedFileInfo(
            filevers=($major, $minor, $patch, 0),
            prodvers=($major, $minor, $patch, 0),
            mask=0x3f,
            flags=0x0,
            OS=0x40004,
            fileType=0x1,
            subtype=0x0,
            date=(0, 0)
            ),
          kids=[
            StringFileInfo(
              [
              StringTable(
                u'040904B0',
                [StringStruct(u'CompanyName', u'Intel Corporation'),
                StringStruct(u'FileDescription', u'IntelAvatar - Wireless CE Log Analysis Tool'),
                StringStruct(u'FileVersion', u'$version.0'),
                StringStruct(u'InternalName', u'IntelAvatar'),
                StringStruct(u'LegalCopyright', u'Copyright © 2026 Intel Corporation'),
                StringStruct(u'OriginalFilename', u'IntelAvatar.exe'),
                StringStruct(u'ProductName', u'IntelAvatar'),
                StringStruct(u'ProductVersion', u'$version.0'),
                StringStruct(u'Comments', u'Git: $gitHash | Build: $buildDate')])
              ]), 
            VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
          ]
        )
        "@
        
        Set-Content -Path "version_info.txt" -Value $versionInfoContent -Encoding UTF8
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
    - name: Run linter (optional)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Build with PyInstaller
      run: |
        pip install pyinstaller
        pyinstaller IntelAvatar.spec
    
    - name: Rename exe with version and SHA1
      run: |
        $version = "${{ steps.version.outputs.VERSION }}"
        $gitHash = "${{ steps.version.outputs.GIT_HASH }}"
        Move-Item -Path "dist/IntelAvatar/IntelAvatar.exe" -Destination "dist/IntelAvatar/IntelAvatar_v${version}_$gitHash.exe" -Force
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      id: artifact-upload
      with:
        name: IntelAvatar-build
        path: dist/
    
    - name: Comment PR with artifact link
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ Build successful! 
            
            📦 Download artifact: [IntelAvatar-build](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
          })
