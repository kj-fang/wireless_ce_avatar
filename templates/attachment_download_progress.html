<!-- progress.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Progress</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- SVG Banner -->
    <div class="form-container mb-4 p-0 overflow-hidden" 
        style="position: relative; border-radius: 0; margin-top: 0;">
        <img src="{{ url_for('static', filename='nav_bar.svg') }}" 
            alt="Banner" 
            class="w-100" 
            style="border-radius: 0; display: block; margin-top: 0;">

            <!-- clickable  logo -->  
        <a href="{{ url_for('main.index') }}" 
            style="position: absolute; 
                    top: 0; 
                    left: 0; 
                    width: 20%; 
                    height: 100%; 
                    cursor: pointer; 
                    z-index: 10;"
            title="Return to home"
            aria-label="Return to home">
        </a>
    </div>
    <div class="container mt-5">
        <h3 class="d-flex align-items-center" data-path="{{ download_path }}">
            Download Progress
            <div class="spinner-border text-primary ml-3" role="status" id="loading-spinner" style="width: 1.5rem; height: 1.5rem;">
                <span class="sr-only">Loading...</span>
            </div>
        </h3>

        <div class="d-flex align-items-center mb-3">
            <span class="mr-2"><strong>Download Path:</strong> {{ download_path }}</span>
            <button class="btn btn-sm btn-outline-primary ml-2" onclick="openDownloadPath()">Open</button>
        </div>

        {% for name in files_to_download %}
        <div class="mb-3">
            <label>
                <strong>{{ name }}</strong>
                <span id="size-{{ name }}" class="text-muted" style="font-size: 0.9em;"></span>
            </label>
            <div class="progress">
                <div id="bar-{{ name }}" class="progress-bar" role="progressbar" style="width: 0%;">0%</div>
            </div>
            <small id="eta-{{ name }}" class="text-muted">ETA: --</small>
            <small id="retry-{{ name }}" class="text-warning" style="display:none;"></small>
            <ul id="retry-history-{{ name }}" class="mt-1 mb-0 pl-3 text-muted" style="font-size: 0.85em;"></ul>
        </div>
        {% endfor %}

        <div class="mt-4 text-center">
            <span id="cancel-download-btn"
                  onclick="showCancelModal()"
                  style="display: inline-block;
                         cursor: pointer;
                         background: rgba(220, 53, 69, 0.15);
                         color: #dc3545;
                         border: 1px solid rgba(220, 53, 69, 0.4);
                         border-radius: 12px;
                         padding: 4px 10px;
                         font-size: 12px;
                         font-weight: 600;
                         box-shadow: 0 0 6px rgba(220, 53, 69, 0.35);
                         transition: box-shadow 0.2s ease, background 0.2s ease;"
                  onmouseover="this.style.background='rgba(220, 53, 69, 0.25)'; this.style.boxShadow='0 0 10px rgba(220, 53, 69, 0.55)';"
                  onmouseout="this.style.background='rgba(220, 53, 69, 0.15)'; this.style.boxShadow='0 0 6px rgba(220, 53, 69, 0.35)';">
                Cancel Download
            </span>
        </div>
    </div>

    <!-- Cancel confirmation modal -->
    <div id="cancel-modal-overlay"
         style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
                background:rgba(0,0,0,0.5); z-index:1050;">
        <div style="background:#fff; max-width:420px; margin:15% auto; padding:24px;
                    border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.3);">
            <h5 class="mb-3">Cancel Download?</h5>
            <p class="text-muted">This action will stop downloading the files. Any in-progress downloads will be aborted.</p>
            <div class="d-flex justify-content-end mt-4">
                <button class="btn btn-secondary mr-2" onclick="hideCancelModal()">Keep Downloading</button>
                <button class="btn btn-danger" id="confirm-cancel-btn" onclick="confirmCancelDownload()">Stop Download</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io('/progress');
        const fileSizes = {};
        // Once the flow reaches a terminal state (completed or explicitly
        // cancelled) we must NOT fire the leave-page cancel beacon.
        let downloadFinished = false;

        // If the user navigates away from this page (e.g. closes the tab or
        // refreshes), cancel the in-progress downloads and clean up partial
        // files — same behaviour as the Cancel button. (The browser Back
        // button is handled separately below so we can show the modal.)
        function cancelDownloadOnLeave() {
            if (downloadFinished) return;
            try {
                navigator.sendBeacon('/download/cancel_download');
            } catch (e) {
                console.warn('cancel beacon failed', e);
            }
        }
        window.addEventListener('pagehide', cancelDownloadOnLeave);
        window.addEventListener('beforeunload', cancelDownloadOnLeave);

        // Trap the browser Back button so we can show the SAME confirmation
        // modal as the Cancel button instead of silently leaving. Push a dummy
        // history entry so the first Back press fires popstate on THIS page
        // rather than navigating away.
        history.pushState(null, '', location.href);
        window.addEventListener('popstate', function () {
            if (downloadFinished) return;
            // Re-push so we stay on this page while the modal is shown.
            history.pushState(null, '', location.href);
            showCancelModal();
        });

        function openDownloadPath() {
            const path = document.querySelector('h3[data-path]').dataset.path;
            console.log(path)
            fetch('/open_path', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ path: path })
            })
            .then(response => {
                if (response.ok) {
                    console.log('Path opened successfully');
                } else {
                    console.error('Failed to open path');
                }
            });
        }

        function showCancelModal() {
            document.getElementById('cancel-modal-overlay').style.display = 'block';
        }

        function hideCancelModal() {
            document.getElementById('cancel-modal-overlay').style.display = 'none';
        }

        function confirmCancelDownload() {
            const confirmBtn = document.getElementById('confirm-cancel-btn');
            confirmBtn.disabled = true;
            confirmBtn.innerText = 'Stopping...';
            socket.emit('cancel_download');
        }

        const cancel_redirect_URL = "{{ url_for('main.select_attachments') }}";
        socket.on('download_cancelled', function() {
            downloadFinished = true;
            window.location.href = cancel_redirect_URL;
        });

        socket.on('download_retry', function(data) {
            const retryElem = document.getElementById(`retry-${data.name}`);
            const retryHistoryElem = document.getElementById(`retry-history-${data.name}`);
            let reasonText = 'Retry triggered due to a temporary issue.';

            if (data.reason === 'stall_timeout') {
                reasonText = `No progress for ${data.stall_timeout}s.`;
            } else if (data.reason === 'missing_content_length') {
                reasonText = 'Unable to read Content-Length from server response.';
            } else if (data.reason === 'unexpected_error') {
                reasonText = 'Unexpected error occurred during download.';
            }

            if (retryElem) {
                retryElem.style.display = 'block';
                retryElem.innerText = `⚠️ Retrying download (${data.retry}/${data.max_retry})...`;
            }

            if (retryHistoryElem) {
                const item = document.createElement('li');
                item.innerText = `${data.retry_time} | Retry ${data.retry}/${data.max_retry} | ${reasonText}`;
                retryHistoryElem.appendChild(item);
            }
        });

        socket.on('file_info', function(data) {
            const { name, size } = data;
            fileSizes[name] = size;
            const sizeElem = document.getElementById(`size-${name}`);
            if (sizeElem) {
                sizeElem.innerText = `(${(size / 1024 ).toFixed(2)} KB)`;
            }
        });

        // Start download automatically after connection
        socket.on('connect', function() {
            console.log('Connected. Starting download...');
            socket.emit('start_download');
        });

        // Update progress
        socket.on('progress_update', function(data) {
            const bar = document.getElementById(`bar-${data.name}`);
            const etaElem = document.getElementById(`eta-${data.name}`);
            const retryElem = document.getElementById(`retry-${data.name}`);
            console.log("etaElem:", etaElem)
            if (bar) {
                bar.style.width = `${data.progress}%`;
                bar.innerText = `${data.progress.toFixed(1)}%`;
            }
            if (etaElem && data.eta !== null) {
                const minutes = Math.floor(data.eta / 60);
                const seconds = Math.floor(data.eta % 60);
                etaElem.innerText = `ETA: ${minutes}m ${seconds}s`;
            }
            if (retryElem && data.progress > 0) {
                retryElem.style.display = 'none';
                retryElem.innerText = '';
            }
        });

        // All downloads completed

        const download_result_URL = "{{ url_for('main.download_result') }}";
        socket.on('all_attachments_download_done', function() {
            downloadFinished = true;
            window.location.href = download_result_URL;
        });

        const download_result_URL_BSOD = "{{ url_for('main.download_result_bsod') }}";
        socket.on('all_attachments_download_done_bsod', function() {
            downloadFinished = true;
            window.location.href = download_result_URL_BSOD;
        });
    </script>
</body>
</html>
