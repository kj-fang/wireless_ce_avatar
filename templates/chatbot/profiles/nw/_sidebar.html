{% import 'chatbot/profiles/_sidebar_parts.html' as sb with context %}
{{ sb.switcher() }}

        <!-- View 1: live controls (Sleep Study / Skills / Quick questions) -->
        <div id="sidebar-controls-view">

<!-- Sleep Study report. The driver log of each time point is chosen in the
     chat once the report is read (nw.js renderPlanCard). -->
<div class="sidebar-section">
    <h6>🛌 Sleep Study</h6>
    <div class="log-input-group">
        <input id="sleepstudy-path-input" type="text"
               placeholder="Full path to sleepstudy file…"
               onkeydown="if(event.key==='Enter'){event.preventDefault();setSleepstudy();}">
        <button class="btn-browse" onclick="browseSleepstudy()" title="Browse for file">📁</button>
    </div>
    <button class="btn-set-log" style="width:100%;margin-top:6px;" onclick="setSleepstudy()">Load</button>
    <div id="sleepstudy-status" class="log-status"></div>
</div>

<!-- Skills -->
<div class="sidebar-section">
    <h6>🛠 Available Skills</h6>
    <div id="skills-list">
        <div style="font-size:0.78rem;color:#aaa;">Load a Sleep Study report to see skills.</div>
    </div>
    <button class="btn-set-log" style="width:100%;margin-top:8px;"
            onclick="appendSkillsFromYaml()" id="skill-append-btn"
            title="Pick a YAML file; its skills are appended to your customised configuration (duplicates overwrite)."
            >📥 Append Skills from YAML…</button>
    <div id="skill-editor-status" class="log-status"></div>
</div>

{{ sb.quick_questions() }}

        </div><!-- /#sidebar-controls-view -->

{{ sb.history_view() }}
