bluetooth_topics:
  - topic: "Bluetooth Core Specification"
    explanation: "Defines the technologies required to create interoperable Bluetooth devices."

  - topic: "Logical Link Control and Adaptation Protocol (L2CAP)"
    explanation: "Provides channel-based communication, multiplexing, segmentation, and reassembly over Bluetooth links."

  - topic: "Secure Simple Pairing"
    explanation: "Simplifies device pairing while improving security and reducing susceptibility to recording attacks."

  - topic: "Adaptive Frequency Hopping (AFH)"
    explanation: "Improves reliability by avoiding radio frequencies affected by interference."

  - topic: "Channel Sounding"
    explanation: "Creates and manages Channel Sounding links used for distance estimation and attack detection."

  - topic: "Asynchronous Connection-oriented Logical Transport (ACL)"
    explanation: "Carries LMP, L2CAP, and user data using a retransmission mechanism for reliability."

  - topic: "LE Physical Layers (PHYs)"
    explanation: "Bluetooth LE supports multiple PHYs to balance speed, range, and robustness."

  - topic: "Header Error Check (HEC)"
    explanation: "An 8-bit integrity check used to validate packet headers before further packet processing."

  - topic: "Sniff Mode"
    explanation: "Reduces power consumption by allowing a device to periodically sleep between activities."

  - topic: "Universal Unique Identifier (UUID)"
    explanation: "Uniquely identifies Bluetooth services, characteristics, and attributes."

  - topic: "Piconet"
    explanation: "A Bluetooth network consisting of one Central and one or more synchronized Peripherals."

  - topic: "Bluetooth Device Address (BD_ADDR)"
    explanation: "A unique 48-bit identifier assigned to a Bluetooth device."

  - topic: "Central"
    explanation: "Controls timing and frequency hopping for devices participating in a piconet."

  - topic: "Peripheral"
    explanation: "A device synchronized to a Central and participating in Bluetooth communication."

  - topic: "Bluetooth Core System Protocols"
    explanation: "Includes PHY, Link Layer, Link Manager, Link Control, and L2CAP protocols."

  - topic: "Service Discovery Protocol (SDP)"
    explanation: "Allows devices to discover services available on other Bluetooth devices."

  - topic: "Attribute Protocol (ATT)"
    explanation: "Provides access to attributes such as characteristics and descriptors."

  - topic: "Device Control Services"
    explanation: "Manage operational modes and device behavior."

  - topic: "Transport Control Services"
    explanation: "Create, modify, and release Bluetooth communication channels and links."

  - topic: "Data Services"
    explanation: "Transfer application data over Bluetooth communication bearers."

  - topic: "Unreliable Link"
    explanation: "A communication path that cannot guarantee successful delivery of packets."

  - topic: "Enhanced Data Rate (EDR)"
    explanation: "Provides higher throughput than Basic Rate Bluetooth."

  - topic: "LE Isochronous Channels"
    explanation: "Enable time-sensitive data transport such as audio streaming."

  - topic: "Broadcast Isochronous Group (BIG)"
    explanation: "Synchronizes multiple broadcast audio or data streams."

  - topic: "Filter Accept List"
    explanation: "Restricts communication to approved remote devices."

  - topic: "Secure Simple Pairing MITM Protection"
    explanation: "Uses methods such as passkey entry and numeric comparison to reduce MITM attacks."

  - topic: "Numeric Comparison Authentication"
    explanation: "Users compare displayed numbers on two devices to verify a secure connection."

  - topic: "Resolving List"
    explanation: "Stores keys and addresses used to resolve private Bluetooth addresses."

  - topic: "Encrypted Advertising Data"
    explanation: "Protects advertising information using encryption and shared keys."

  - topic: "GATT Service"
    explanation: "Represents a collection of related data and behaviors for a device function."

  - topic: "Included Services (GATT)"
    explanation: "Allows one GATT service to reference another service definition."

  - topic: "Train Nudging"
    explanation: "Improves success rates for inquiry and paging operations in constrained environments."

  - topic: "Coarse Clock Adjustment"
    explanation: "Adjusts Bluetooth timing to align with external wireless technologies."

  - topic: "Clock Dragging"
    explanation: "Gradually shifts Bluetooth timing using small slot-length adjustments."

  - topic: "Slot Availability Mask (SAM)"
    explanation: "Communicates available transmission and reception slots between devices."

  - topic: "Angle of Arrival/Departure (AoA/AoD)"
    explanation: "Determines the direction of a radio signal using antenna measurements."

  - topic: "Message Integrity Check (MIC)"
    explanation: "Authenticates encrypted Bluetooth data packets."

  - topic: "Removed Features"
    explanation: "Features no longer recommended but still allowed for legacy compatibility."

  - topic: "Deprecated Features"
    explanation: "Legacy features replaced by improved alternatives."

  - topic: "Keyword 'shall'"
    explanation: "Indicates a mandatory requirement in the Bluetooth specification."

  - topic: "Keyword 'should'"
    explanation: "Indicates a recommendation rather than a strict requirement."

  - topic: "Reserved for Future Use Values"
    explanation: "Value ranges reserved for future specification updates and not intended for current use."

  - topic: "Assigned Numbers"
    explanation: "Official Bluetooth SIG identifiers used for protocols, services, and characteristics."

  - topic: "Responding to Invalid Behavior"
    explanation: "Defines recovery methods for unexpected or malformed protocol behavior."

  - topic: "Preamble"
    explanation: "The initial synchronization pattern at the start of a Bluetooth packet."

  - topic: "Sync Word"
    explanation: "A unique pattern used to identify and synchronize packet reception."

  - topic: "Trailer"
    explanation: "A concluding pattern used for improved signal handling."

  - topic: "ARQ Scheme"
    explanation: "Retransmits packets when acknowledgements indicate delivery failure."

  - topic: "Flush Timeout"
    explanation: "Specifies when pending ACL packets are removed from controller buffers."

  - topic: "Inquiry Scan Substate"
    explanation: "Listens for Bluetooth discovery requests from other devices."

  - topic: "Inquiry Response Substate"
    explanation: "Responds to discovery requests with device information."

  - topic: "SCO Logical Transport"
    explanation: "Provides low-latency transport for voice and other time-sensitive data."

  - topic: "eSCO Logical Transport"
    explanation: "Extends SCO with retransmission support for improved quality."

  - topic: "Role Switch"
    explanation: "Allows Central and Peripheral roles to be exchanged during operation."

  - topic: "LMP_CLK_ADJ PDU"
    explanation: "Controls coarse clock synchronization between Bluetooth devices."

  - topic: "LMP_SAM_DEFINE_MAP PDU"
    explanation: "Defines or updates Slot Availability Mask scheduling information."

  - topic: "LMP_IO_CAPABILITY_REQ PDU"
    explanation: "Exchanges device IO capabilities for pairing method selection."

  - topic: "LMP_ENCAPSULATED_HEADER PDU"
    explanation: "Supports transmission of LMP messages that exceed a single packet size."

  - topic: "LMP_ENCRYPTION_KEY_SIZE_REQ PDU"
    explanation: "Negotiates encryption key length between connected devices."

  - topic: "HCI_Create_Connection Command"
    explanation: "Initiates creation of a Bluetooth connection from the Host."

  - topic: "HCI_Switch_Role Command"
    explanation: "Requests a role change between Central and Peripheral devices."
