P2P_PIE_Supported_Channel_Query:
  name: "P2P PIE Supported-Channel Query"
  description: "Diagnoses the per-channel regulatory gate decisions made during a PIE-initiated OID_WIFI_P2P_GO_QUERY_SUPPORTED_CHANNELS session, covering the full evaluation loop from PHY-config check through regulatory allowance verdict to the returned channel list. Applies when: OID_WIFI_P2P_GO_QUERY_SUPPORTED_CHANNELS is issued by PIE (external application); P2P GO channel list returned to PIE is suspect — missing channels or unexpected exclusions."
  keywords:
    - "Got Proprietary"
    - "OID_WIFI_P2P_GO_QUERY_SUPPORTED_CHANNELS"
    - "[mvmManagerFindSimilarPhyConfig]"
    - "[vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures]"
    - "vifMgrChSelGetSupportedChannelList"
  exclusive:
    - "GO_VIF"
    - "P2P_GO"
    - "GO activated with SSID"
    - "TASK_START_AP"
    - "[prvChSelBestChDumpOperatingChannelList]"
    - "ROAM_DECISION"
    - "CNCT_FLOW"
    - "TLC_CONFIG"
    - "LAR"
  expert_rules: |
    1. Session entry point.
    - 'Got Proprietary' is the required session-boundary anchor line. It carries the full PIE query context: OID name, OID hex code, and BSS handle.
    - If the log contains:
      04/16/2026-20:45:52.482 [2] [OSC] [SPECIAL] [osal::CCmdPropIhvRequest::execute]:Got Proprietary OID OID_WIFI_P2P_GO_QUERY_SUPPORTED_CHANNELS[0xFF10080B] (p-0x0, BSS)
      Then conclude:
      - A PIE-initiated supported-channel query session has started at this timestamp.
      - All subsequent [mvmManagerFindSimilarPhyConfig] and [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures] lines until the next 'Got Proprietary' OID_WIFI_P2P_GO_QUERY_SUPPORTED_CHANNELS line belong to this session.
      - 'Got Proprietary' lines for other OIDs (e.g. OID_SV_RLG_FLUSH_LOG_FILE, OID_SV_APPLICATION_PRINT, OID_WIFI_MCC_API_TEST_MODE) are not session anchors for this skill — skip them.

    2. Per-channel evaluation loop structure.
    - For every channel evaluated, the loop fires in this guaranteed order:
      a. One or more [mvmManagerFindSimilarPhyConfig] lines (PHY-config check; may emit supplementary info lines beyond the 'Channel requirements' line).
      b. Exactly one [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures] line (regulatory gate verdict).
    - The [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures] line is the authoritative per-channel verdict anchor. All [mvmManagerFindSimilarPhyConfig] lines between two consecutive verdict lines belong to the same channel evaluation.
    - Example PHY-config line:
      04/16/2026-20:45:52.483 [2] [MVM_MANAGER] [SPECIAL] [mvmManagerFindSimilarPhyConfig]:  Channel requirements: control channel 1 (2.4GHz), center frequency 3, bandwidth 1
    - Example verdict line (allowed):
      04/16/2026-20:45:52.483 [2] [VIF_MANAGER] [SPECIAL] [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures]:: requested channel 1 is active in Eeprom, allowed for GO activation
    - Example verdict line (rejected):
      04/16/2026-20:45:52.483 [2] [VIF_MANAGER] [SPECIAL] [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures]:: requested channel: 44 (5.2GHz) is not allowed for GO different channel activation, BSS on 165 (5.2GHz)

    3. Per-channel verdict classification.
    - If the verdict line contains 'allowed for GO activation':
      - Channel = ALLOWED. Add to expected returned list.
    - If the verdict line does NOT contain 'allowed for GO activation':
      - Channel = REJECTED. Record the full rejection reason string verbatim.
      - If the rejection reason cites 'BSS on <channel>':
        - Conclude: MCC-driven exclusion. The concurrent BSS on the cited channel forces this channel out of the GO candidate list.
      - If the rejection reason cites 'not active in Eeprom' or similar Eeprom language:
        - Conclude: Regulatory/Eeprom exclusion. Channel is not enabled for this regulatory domain.
      - If the rejection reason cites DFS or radar:
        - Conclude: DFS exclusion.
      - For any other rejection reason string: surface it verbatim and flag for engineer review — the full enumeration of rejection reasons is not exhaustively documented in this skill.

    4. Returned channel list verification.
    - After the per-channel loop, [vifMgrChSelGetSupportedChannelList] lines enumerate the channels returned to PIE.
    - Example:
      04/17/2026-18:32:18.969 [2] [VIF_MANAGER] [SPECIAL] [vifMgrChSelGetSupportedChannelList]: : OID_WIFI_P2P_GO_QUERY_SUPPORTED_CHANNELS returned channel 149
    - Cross-check: every channel in the returned list must have an 'allowed for GO activation' verdict in the loop above. Any mismatch (channel returned but rejected, or channel allowed but not returned) is a bug — flag it.
    - If a channel expected by the caller is absent from the returned list, locate its verdict line and surface the rejection reason as the root cause.

    5. Structural anomaly check.
    - Every [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures] line must be preceded by at least one [mvmManagerFindSimilarPhyConfig] line in the same session. If a verdict line appears with no preceding PHY-config line, flag as a structural anomaly.
    - [mvmManagerFindSimilarPhyConfig] hit count will be >= [vifMgrChSelIsGoRegulatoryAllowedChannelFromChFeatures] hit count due to supplementary output lines. A large delta (engineer-provided threshold: not yet established) may indicate log truncation at session boundaries.