<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case Number Input - New Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js" crossorigin="anonymous"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif !important;
        }
        
        /* Keep Inter font for loading messages */
        #case-log-messages,
        #case-log-messages *,
        #upload-log-messages,
        #upload-log-messages * {
            font-family: 'Inter', sans-serif !important;
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            margin-top: 50px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .loading-box {
            display: none;
            margin-top: 20px;
        }
        .section-divider {
            border-top: 2px dashed #ccc;
            margin: 40px 0 20px;
        }
        img {
            -webkit-backface-visibility: hidden;
            -webkit-transform: translateZ(0) scale(1.001, 1);
            transform: translateZ(0) scale(1.001, 1);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Tab Styles */
        .tabs-container {
            width: 480px;
            margin: 50px auto 0;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            cursor: pointer;
            background-color: #f8f9fa;
            border: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            border-radius: 5px;
            font-weight: 500;
            color: #666;
        }
        .tab:hover {
            background-color: #e9ecef;
            color: #1177c0;
        }
        .tab.active {
            background-color: #1177c0;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* File Upload Styles */
        .upload-zone {
            border: 2px dashed #0068B6;
            border-radius: 12px;
            padding: 10px 40px;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-zone:hover {
            background-color: #e3f2fd;
            border-color: #0056a0;
        }
        .upload-zone.drag-over {
            background-color: #bbdefb;
            border-color: #0056a0;
        }
        .file-list {
            margin-top: 20px;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .file-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-remove {
            cursor: pointer;
            color: #dc3545;
            font-weight: bold;
        }
        .upload-submit-btn {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #0068B6;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-submit-btn:hover {
            background-color: #0056a0;
        }
        .upload-submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .action-type-select {
            width: 160px !important;
            min-width: 160px !important;
            max-width: 160px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;            text-align: center;
            text-align-last: center;        }
    </style>
</head>

<body>
    <!-- SVG Banner -->
    <div class="form-container mb-4 p-0 overflow-hidden" 
        style="border-radius: 0; margin-top: 0; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);">
        <img src="{{ url_for('static', filename='banner.svg') }}"
            alt="Banner" 
            class="w-100" 
            style="display: block; width: 100%; height: auto; shape-rendering: crispEdges;">
    </div>


    <!-- Flash message placeholder -->
    <div class="mt-3" style="display: none;">
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            Sample success message
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    </div>

    <!-- Tabs Container -->
    <div class="tabs-container" id="tabs-container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('case-number')" style="font-weight:bold;">Case Number Analysis</button>
            <button class="tab" onclick="switchTab('local-upload')" style="font-weight:bold;">Local File Upload</button>
        </div>

        <!-- Tab 1: Case Number Analysis -->
        <div id="case-number-tab" class="tab-content active">
            <div id="form-box">
        <form id="mainForm" method="post" onsubmit="handleSubmit(event)">
            <div style="display: flex; gap: 0; margin-bottom: 15px; position: relative;">
                <select id="action_type" class="form-control action-type-select" style="border-radius: 25px 0 0 25px; padding: 8px 15px 8px 10px; border-right: none; background-color: #0068B6 ; color: rgb(255, 255, 255); font-weight: bold;">
                    <option value="submit" style="background-color: white; color: black;">Submit</option>
                    <option value="etl" style="background-color: white; color: black;">ETL Analysis</option>
                    <option value="etl_llm" style="background-color: white; color: black;">ETL Analysis with LLM</option>
                </select>
                <input type="text" class="form-control" id="case_number" name="case_number" placeholder="Enter case number here" value="" required style="border-radius: 0 25px 25px 0; padding: 12px 50px 12px 20px; flex: 1;">
                <button type="submit" class="btn btn-primary" aria-label="Search" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); border-radius: 20px; padding: 6px 12px; font-size: 14px; background-color: transparent; border-color: transparent;">
                    <img src="../static/Magnifying_glass.svg" alt="Search" style="width: 20px; height: 20px;">
                </button>
            </div>
        </form>
            </div>
        </div>

        <!-- Tab 2: Local File Upload -->
        <div id="local-upload-tab" class="tab-content">
                <div class="upload-zone" id="upload-zone" onclick="openLocalFileChooser()">
                    <div style="pointer-events: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#0068B6" viewBox="0 0 16 16" style="margin-bottom: 10px;">
                            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                            <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                        </svg>
                        <h5 style="color: #0068B6; margin-bottom: 10px;">Click to browse</h5>
                        <p style="color: #666; font-size: 14px; margin: 0;">Supported: .zip, .7z, .rar, .etl, .log or .dmp files</p>
                    </div>
                </div>

                <div id="file-list" class="file-list"></div>
                <label id="bsod-checkbox" style="margin-top: 5px;">
                    <input type="checkbox" id="bsod-checkbox-input">
                    <span style="color: #666; font-size: 14px;">This is a BSOD dump</span>
                </label>
                <button id="upload-submit-btn" class="upload-submit-btn" onclick="submitLocalUpload()" disabled>
                    Start Analysis
                </button>
            </div>
    </div>

    <!-- Case number loading indicator -->
    <div id="case-loading-box" class="text-center loading-box">
        <div style="position: relative; width: 50%; margin: 0 auto;">
            <div id="case-log-messages" class="text-left px-3 py-2"
                style="
                    min-height: 200px;
                    max-height: 200px;
                    overflow-y: auto;
                    font-size: 0.9em;
                    background-color: rgb(53, 53, 53);
                    color: white;
                    border-radius: 6px;
                    font-family: 'Inter', sans-serif;
                    white-space: pre-wrap;
                    box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
                    line-height: 1.6;
                    padding-bottom: 60px;
                ">
                Validating case number...
            </div>
            <img src="../static/pacman.gif" alt="Loading..." style="width: 200px; height: 200px; position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);">
        </div>
    </div>

    <!-- Local upload loading indicator -->
    <div id="upload-loading-box" class="text-center loading-box">
        <div style="width: 50%; margin: 0 auto;">
            <div id="upload-log-messages" class="text-left px-3 py-2"
                style="
                    min-height: 200px;
                    max-height: 200px;
                    overflow-y: auto;
                    font-size: 0.9em;
                    background-color: rgb(53, 53, 53);
                    color: white;
                    border-radius: 6px;
                    font-family: 'Inter', sans-serif;
                    white-space: pre-wrap;
                    box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
                    line-height: 1.6;
                ">
                Preparing local file upload...
            </div>
        </div>
    </div>


    
    <!-- 🤖 Log Chatbot shortcut -->
    <div style="width: 480px; margin: 20px auto 0; background: transparent; padding: 16px 24px; text-align: center;">
        <a href="/log_chatbot/" style="
            display: inline-flex; align-items: center; gap: 7px;
            background: linear-gradient(135deg,#0071c5,#00a3e0);
            color: white; text-decoration: none;
            padding: 9px 22px; border-radius: 25px;
            font-size: 0.85rem; font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,113,197,0.3);
            transition: opacity 0.2s;"
            onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
            📡 Wi-Fi Log Chatbot
        </a>
    </div>

    <div class="mb-5"></div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Main functionality script -->
    <script>
        const CASE_MESSAGES = [
            "- Validating case number...",
            "- Fetching case description...",
            "- Fetching related files...",
            "- Parsing attachment links...",
            "- Report is almost ready...",
        ];

        let currentIndex = 0;
        let LogInterval;
        let activeMessages = CASE_MESSAGES;
        let activeLogAreaId = 'case-log-messages';
        let uploadSocket = null;
        let uploadProgressLine = null;
        let uploadPreparingTimeoutId = null;

        function clearUploadPreparingTimeout() {
            if (uploadPreparingTimeoutId !== null) {
                clearTimeout(uploadPreparingTimeoutId);
                uploadPreparingTimeoutId = null;
            }
        }

        function hideAllLoadingBoxes() {
            document.getElementById('case-loading-box').style.display = 'none';
            document.getElementById('upload-loading-box').style.display = 'none';
        }

        function showLogMessage() {
            const logArea = document.getElementById(activeLogAreaId);
            if (!logArea) {
                return;
            }

            if (currentIndex < activeMessages.length) {
                const p = document.createElement('div');
                p.textContent = activeMessages[currentIndex];
                logArea.appendChild(p);
                logArea.scrollTop = logArea.scrollHeight;
                currentIndex++;
            } else {
                clearInterval(LogInterval);
            }
        }

        function startLogs(logAreaId, messages) {
            clearInterval(LogInterval);
            currentIndex = 0;
            activeLogAreaId = logAreaId;
            activeMessages = messages;
            const logArea = document.getElementById(activeLogAreaId);
            if (!logArea) {
                return;
            }
            logArea.innerHTML = '';
            const Delay = Math.floor(Math.random() * 1500) + 2000;
            LogInterval = setInterval(showLogMessage, Delay);
            showLogMessage();
        }

        function showCaseLoading() {
            document.getElementById('form-box').style.display = 'none';
            hideAllLoadingBoxes();
            document.getElementById('case-loading-box').style.display = 'block';
            startLogs('case-log-messages', CASE_MESSAGES);
        }

        function showLocalUploadLoading() {
            document.getElementById('tabs-container').style.display = 'none';
            hideAllLoadingBoxes();
            document.getElementById('upload-loading-box').style.display = 'block';
            const logArea = document.getElementById('upload-log-messages');
            if (logArea) {
                logArea.innerHTML = '- Validating the files....';
                uploadProgressLine = null;
                clearUploadPreparingTimeout();
                uploadPreparingTimeoutId = setTimeout(() => {
                    uploadPreparingTimeoutId = null;
                    if (logArea) {
                        const p = document.createElement('div');
                        p.textContent = '- Preparing the uploads';
                        logArea.appendChild(p);
                        logArea.scrollTop = logArea.scrollHeight;
                    }
                }, 3000);
            }
        }

        function connectUploadProgressSocket() {
            if (uploadSocket) {
                uploadSocket.disconnect();
                uploadSocket = null;
            }
            uploadSocket = io('/progress');
            uploadSocket.on('wpp_log', function(data) {
                const logArea = document.getElementById('upload-log-messages');
                if (!logArea) {
                    return;
                }

                const message = String(data.data || '').trim();
                if (!message) {
                    return;
                }

                clearUploadPreparingTimeout();

                if (message.startsWith('Uploading ')) {
                    if (!uploadProgressLine || !uploadProgressLine.isConnected) {
                        uploadProgressLine = document.createElement('div');
                        uploadProgressLine.style.whiteSpace = 'pre';
                        logArea.appendChild(uploadProgressLine);
                    }
                    uploadProgressLine.textContent = '- ' + message;
                } else {
                    const p = document.createElement('div');
                    p.textContent = '- ' + message;
                    logArea.appendChild(p);

                    if (message.startsWith('Upload complete')) {
                        uploadProgressLine = null;
                    }
                }

                logArea.scrollTop = logArea.scrollHeight;
            });
        }

        function disconnectUploadSocket() {
            if (uploadSocket) {
                uploadSocket.disconnect();
                uploadSocket = null;
            }
            clearUploadPreparingTimeout();
        }

        // Handle form submission based on dropdown selection
        async function handleSubmit(event) {
            event.preventDefault();
            
            const actionType = document.getElementById('action_type').value;
            const caseNumber = document.getElementById('case_number').value.trim();

            if (!caseNumber) {
                alert("⚠️ Please enter a Case Number first!");
                return;
            }

            if (actionType === 'submit') {
                // Regular submit - just show loading and submit form
                showCaseLoading();
                document.getElementById('mainForm').submit();
            } else if (actionType === 'etl') {
                // ETL Analysis
                await runLatestETL(caseNumber);
            } else if (actionType === 'etl_llm') {
                // ETL Analysis with LLM
                await runLatestETLWithLLM(caseNumber);    
            } else {
                alert("❌ Unsupported action selected. Please choose a valid option and try again.");
            }
        }

        async function runLatestETL(caseNumber) {
            // Show loading animation and log messages
            showCaseLoading();

            try {
                // Step 1: Submit case number and wait for the server to complete session setup.
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `case_number=${encodeURIComponent(caseNumber)}`
                });

                // Step 2: If successful, redirect to the analysis page.
                if (response.ok) {
                    console.log("✅ Case number POST completed. Redirecting...");
                    window.location.href = '/automation/run_latest_etl';
                } else {
                    throw new Error("Server returned error " + response.status);
                }

            } catch (error) {
                alert('❌ Error occurred: ' + error);
                // Restore the original view if needed.
                document.getElementById('form-box').style.display = 'block';
                hideAllLoadingBoxes();
            }
        }

        // Function to trigger LLM-based ETL analysis
        async function runLatestETLWithLLM(caseNumber) {
            showCaseLoading();

            try {
                const response = await fetch('/start_latest_etl_llm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `case_number=${encodeURIComponent(caseNumber)}`
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || (`Server returned error ${response.status}`));
                }

                window.location.href = data.redirect_url;
            } catch (error) {
                alert('❌ Error occurred: ' + error.message);
                document.getElementById('form-box').style.display = 'block';
                hideAllLoadingBoxes();
            }
        }

        // Auto-fill from clipboard and zero-padding
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("case_number");
            if (!input) {
                return;
            }

            // Auto-fill from clipboard
            const autoFillFromClipboard = async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    const trimmed = text.trim();
                    // Check if it's a valid case number (1-8 digits)
                    if (/^\d{1,8}$/.test(trimmed)) {
                        // Auto-pad to 8 digits
                        input.value = trimmed.padStart(8, '0');
                    }
                } catch (err) {
                    // Silently fail - clipboard access denied or not available
                }
            };

            // Try to auto-fill on page load
            autoFillFromClipboard();
            
            // Also try when user focuses the input
            input.addEventListener("focus", autoFillFromClipboard, { once: true });

            // Intercept paste event for auto-padding
            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                const trimmed = pastedText.trim();
                
                if (/^\d{1,8}$/.test(trimmed)) {
                    input.value = trimmed.padStart(8, '0');
                } else {
                    input.value = trimmed;
                }
            });

            // Add zero-padding on blur
            input.addEventListener("blur", () => {
                const value = input.value.trim();
                if (value && /^\d{1,8}$/.test(value)) {
                    input.value = value.padStart(8, '0');
                }
            });

            // Format on Enter key
            input.addEventListener("keypress", (e) => {
                if (e.key === 'Enter') {
                    const value = input.value.trim();
                    if (value && /^\d{1,8}$/.test(value)) {
                        input.value = value.padStart(8, '0');
                    }
                }
            });
        });
        // Tab Switching
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab content
            if (tabName === 'case-number') {
                document.getElementById('case-number-tab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else if (tabName === 'local-upload') {
                document.getElementById('local-upload-tab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }

        // File Upload Handling
        let selectedFiles = [];

        function fileNameFromPath(pathValue) {
            const normalized = String(pathValue || '').replace(/\\/g, '/');
            const parts = normalized.split('/');
            return parts[parts.length - 1] || '';
        }

        async function openLocalFileChooser() {
            try {
                const response = await fetch('/log_parser/pick_local_analysis_file', {
                    method: 'POST'
                });
                const result = await response.json();
                if (!response.ok || !result.success || !result.source_path) {
                    throw new Error(result.message || 'Native picker was cancelled or unavailable.');
                }

                const pickedName = result.filename || fileNameFromPath(result.source_path);
                selectedFiles = [{
                    file: { name: pickedName, size: 0 },
                    sourcePath: result.source_path,
                }];
                updateFileList();
            } catch (error) {
                alert('❌ Native file picker unavailable: ' + error.message);
            }
        }

        function updateFileList() {
            const fileList = document.getElementById('file-list');
            const submitBtn = document.getElementById('upload-submit-btn');
            
            fileList.innerHTML = '';
            
            if (selectedFiles.length === 0) {
                submitBtn.disabled = true;
                return;
            }
            
            submitBtn.disabled = false;
            
            selectedFiles.forEach((item, index) => {
                const file = item.file;
                const sizeLabel = item.sourcePath ? 'native path' : formatFileSize(file.size);
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-item-info">
                        <span>📄</span>
                        <span style="font-weight: 500;">${escapeHtml(file.name)}</span>
                        <span style="color: #666; font-size: 12px;">(${escapeHtml(sizeLabel)})</span>
                    </div>
                    <span class="file-remove" onclick="removeFile(${index})">✕</span>
                `;
                fileList.appendChild(fileItem);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Prevent browser from navigating when files are dropped anywhere on the page
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => e.preventDefault());

        // Drag and Drop
        const uploadZone = document.getElementById('upload-zone');
        let dragCounter = 0;

        uploadZone.addEventListener('dragenter', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragCounter++;
            uploadZone.classList.add('drag-over');
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'copy';
        });

        uploadZone.addEventListener('dragleave', (e) => {
            e.stopPropagation();
            dragCounter--;
            if (dragCounter === 0) {
                uploadZone.classList.remove('drag-over');
            }
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dragCounter = 0;
            uploadZone.classList.remove('drag-over');
            alert('⚠️ Drag and drop is disabled in native-path mode. Please click to open the native file picker.');
        });

        // Submit Local Upload
        async function submitLocalUpload() {
            if (selectedFiles.length === 0) {
                alert('⚠️ Please select at least one file!');
                return;
            }

            const formData = new FormData();

            const selectedItem = selectedFiles[0];
            if (!selectedItem || !selectedItem.sourcePath) {
                alert('⚠️ Please use the native picker and select a local file path.');
                return;
            }

            formData.append('source_path', selectedItem.sourcePath);

            // Show local-upload specific loading and connect socket for real-time logs
            showLocalUploadLoading();
            connectUploadProgressSocket();
            
            if (document.getElementById('bsod-checkbox-input').checked) {
                formData.append('is_bsod', 'true');
            }

            try {
                const response = await fetch('/log_parser/upload_local_analysis', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || ('Upload failed with status: ' + response.status));
                }

                disconnectUploadSocket();

                // .log / .etl: mirror the wpp_complete chatbot flow from download_result.html
                if (result.use_chatbot) {
                    try {
                        if (result.etl_path) {
                            // .etl — ETL already parsed server-side; call prepare to prime the agent
                            const prepareRes = await fetch('/log_chatbot/prepare', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ etl_path: result.etl_path })
                            });
                            const prepareData = await prepareRes.json();
                            if (!prepareData.success) {
                                console.warn('Chatbot prepare warning:', prepareData.error);
                            }
                        } else if (result.log_path) {
                            // .log — set the log directly on the agent
                            await fetch('/log_chatbot/set_log', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ log_path: result.log_path })
                            });
                        }
                    } catch (e) {
                        console.warn('Chatbot prepare step failed, navigating anyway:', e);
                    }
                    window.location.href = '/log_chatbot/?auto_run=analyze_all';
                } else if (result.redirect) {
                    window.location.href = result.redirect;
                } else {
                    alert('✅ Analysis completed successfully!');
                    window.location.reload();
                }
            } catch (error) {
                disconnectUploadSocket();
                alert('❌ Error occurred: ' + error.message);
                document.getElementById('tabs-container').style.display = 'block';
                hideAllLoadingBoxes();
            }
        }
    </script>
