<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case Number Input - New Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/3.1.3/socket.io.min.js" crossorigin="anonymous"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif !important;
        }
        
        /* Keep Inter font for loading messages */
        #case-log-messages,
        #case-log-messages *,
        #upload-log-messages,
        #upload-log-messages * {
            font-family: 'Inter', sans-serif !important;
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .form-container {
            margin-top: 50px;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .loading-box {
            display: none;
            margin-top: 20px;
        }
        .section-divider {
            border-top: 2px dashed #ccc;
            margin: 40px 0 20px;
        }
        img {
            -webkit-backface-visibility: hidden;
            -webkit-transform: translateZ(0) scale(1.001, 1);
            transform: translateZ(0) scale(1.001, 1);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Tab Styles */
        .tabs-container {
            width: 480px;
            margin: 12px auto 0;
			position: relative;
        }
        .chatbot-shortcut {
            position: absolute;
            top: 0;
            left: calc(100% + 10px);
        }
        .chatbot-shortcut-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            padding: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #0071c5, #00a3e0);
            color: white;
            font-weight: 600;
            text-decoration: none;
            transition: width 0.4s ease, box-shadow 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 197, 0.35);
            overflow: hidden;
            white-space: nowrap;
        }
        .chatbot-shortcut-icon {
            flex: 0 0 auto;
            width: 45px;
            text-align: center;
            line-height: 45px;
        }
        .chatbot-shortcut-label {
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            white-space: nowrap;
            transition: max-width 0.35s ease, opacity 0.2s ease;
        }
        .chatbot-shortcut-link:hover {
            color: white;
            text-decoration: none;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(0, 113, 197, 0.45);
            width: 210px;
            border-radius: 25px;
            padding: 0 12px 0 0;
            justify-content: flex-start;
        }
        .chatbot-shortcut-link:hover .chatbot-shortcut-label {
            max-width: 160px;
            opacity: 1;
        }
        .tabs {
            display: flex;
            background-color: #cfd2d5;
            border-radius: 30px;
            margin-bottom: 15px;
            padding: 2px;
            gap: 2px;
        }
        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            cursor: pointer;
            background-color: #cfd2d5;
            border: transparent;
            border-radius: 30px;
            font-weight: 500;
            color: #959595;
        }
        .tab:hover {
            background-color: #cfd2d5;
            color: #343434;
        }
        .tab.active {
            background-color: #fcfcfc;
            color: rgba(0, 0, 0, 0.676);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        
        /* File Upload Styles */
        .upload-bar {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            border: 1px solid #cfd8e3;
            border-radius: 25px;
            background-color: #ffffff;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            font-family: 'Inter', sans-serif;
        }
        .upload-bar:hover {
            border-color: #9fb3c8;
            box-shadow: 0 2px 8px rgba(17, 119, 192, 0.12);
        }
        .upload-bar-file-name {
            flex: 1;
            font-family: 'Inter', sans-serif !important;
            color: #61676f;
            font-size: 15px;
            padding-left: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upload-action-btn {
            width: 37px;
            height: 37px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 0;
            overflow: hidden;
            line-height: 0;
            background-color: transparent;
        }
        .upload-action-btn img {
            width: 20px;
            height: 20px;
            display: block;
            object-fit: contain;
        }
        .upload-action-btn:hover:not(:disabled) {
            background-color: #0056a0;
            transform: translateY(-1px);
        }
        .upload-action-btn:disabled {
            background-color: transparent;
            cursor: not-allowed;
            transform: none;
            opacity: 0.55;
        }
        .upload-hint {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }
        .action-type-select {
            width: 160px !important;
            min-width: 160px !important;
            max-width: 160px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;            
            text-align: center;
            text-align-last: center;        
        }
        .action-icons {
            position: absolute;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 2px;
            align-items: center;
        }
        .icon-action-btn {
            width: 37px;
            height: 37px;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            padding: 0;
        }
        .icon-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        .icon-action-btn.search {
            background-color: transparent;
        }
        .icon-action-btn.search.is-ready {
            background-color: #58acece0;
        }
        .icon-action-btn.etl {
            background-color: #0f8a5f;
        }
        .icon-action-btn.etl-llm {
            background-color: #5b4fcf;
        }
        .icon-action-btn img {
            width: 20px;
            height: 20px;
        }
        
        .upload-action-btn.is-ready {
            background-color: #58acece0;
        }
    </style>
</head>

        <!-- Tab 1: Case Number Analysis -->

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <!-- Main functionality script -->
    <script>
        const CASE_MESSAGES = [
            "- Validating case number...",
            "- Fetching case description...",
            "- Fetching related files...",
            "- Parsing attachment links...",
            "- Report is almost ready...",
        ];

        let currentIndex = 0;
        let LogInterval;
        let activeMessages = CASE_MESSAGES;
        let activeLogAreaId = 'case-log-messages';
        let uploadSocket = null;
        let uploadProgressLine = null;
        let uploadPreparingTimeoutId = null;

        function clearUploadPreparingTimeout() {
            if (uploadPreparingTimeoutId !== null) {
                clearTimeout(uploadPreparingTimeoutId);
                uploadPreparingTimeoutId = null;
            }
        }

        function setChatbotShortcutsVisibility(isVisible) {
            const shortcutContainer = document.getElementById('chatbot-shortcut-links');
            if (!shortcutContainer) {
                return;
            }
            shortcutContainer.style.display = isVisible ? 'flex' : 'none';
        }

        function hideAllLoadingBoxes() {
            document.getElementById('case-loading-box').style.display = 'none';
            document.getElementById('upload-loading-box').style.display = 'none';
            setChatbotShortcutsVisibility(true);
        }

        function showLogMessage() {
            const logArea = document.getElementById(activeLogAreaId);
            if (!logArea) {
                return;
            }

            if (currentIndex < activeMessages.length) {
                const p = document.createElement('div');
                p.textContent = activeMessages[currentIndex];
                logArea.appendChild(p);
                logArea.scrollTop = logArea.scrollHeight;
                currentIndex++;
            } else {
                clearInterval(LogInterval);
            }
        }

        function startLogs(logAreaId, messages) {
            clearInterval(LogInterval);
            currentIndex = 0;
            activeLogAreaId = logAreaId;
            activeMessages = messages;
            const logArea = document.getElementById(activeLogAreaId);
            if (!logArea) {
                return;
            }
            logArea.innerHTML = '';
            const Delay = Math.floor(Math.random() * 1500) + 2000;
            LogInterval = setInterval(showLogMessage, Delay);
            showLogMessage();
        }

        function showCaseLoading() {
            document.getElementById('form-box').style.display = 'none';
            hideAllLoadingBoxes();
            document.getElementById('case-loading-box').style.display = 'block';
            setChatbotShortcutsVisibility(false);
            startLogs('case-log-messages', CASE_MESSAGES);
        }

        function showLocalUploadLoading() {
            document.getElementById('tabs-container').style.display = 'none';
            hideAllLoadingBoxes();
            document.getElementById('upload-loading-box').style.display = 'block';
            setChatbotShortcutsVisibility(false);
            const logArea = document.getElementById('upload-log-messages');
            if (logArea) {
                logArea.innerHTML = '- Validating the files....';
                uploadProgressLine = null;
                clearUploadPreparingTimeout();
                uploadPreparingTimeoutId = setTimeout(() => {
                    uploadPreparingTimeoutId = null;
                    if (logArea) {
                        const p = document.createElement('div');
                        p.textContent = '- Preparing the uploads';
                        logArea.appendChild(p);
                        logArea.scrollTop = logArea.scrollHeight;
                    }
                }, 3000);
            }
        }

        function connectUploadProgressSocket() {
            if (uploadSocket) {
                uploadSocket.disconnect();
                uploadSocket = null;
            }
            uploadSocket = io('/progress');
            uploadSocket.on('wpp_log', function(data) {
                const logArea = document.getElementById('upload-log-messages');
                if (!logArea) {
                    return;
                }

                const message = String(data.data || '').trim();
                if (!message) {
                    return;
                }

                clearUploadPreparingTimeout();

                if (message.startsWith('Uploading ')) {
                    if (!uploadProgressLine || !uploadProgressLine.isConnected) {
                        uploadProgressLine = document.createElement('div');
                        uploadProgressLine.style.whiteSpace = 'pre';
                        logArea.appendChild(uploadProgressLine);
                    }
                    uploadProgressLine.textContent = '- ' + message;
                } else {
                    const p = document.createElement('div');
                    p.textContent = '- ' + message;
                    logArea.appendChild(p);

                    if (message.startsWith('Upload complete')) {
                        uploadProgressLine = null;
                    }
                }

                logArea.scrollTop = logArea.scrollHeight;
            });
        }

        function disconnectUploadSocket() {
            if (uploadSocket) {
                uploadSocket.disconnect();
                uploadSocket = null;
            }
            clearUploadPreparingTimeout();
        }

        // Handle form submission based on dropdown selection
        async function handleSubmit(event, forcedAction) {
            event.preventDefault();

            const actionType = forcedAction || 'submit';
            const caseNumber = document.getElementById('case_number').value.trim();

            if (!caseNumber) {
                alert("⚠️ Please enter a Case Number first!");
                return;
            }

            if (actionType === 'submit') {
                // Regular submit - just show loading and submit form
                showCaseLoading();
                document.getElementById('mainForm').submit();
            } else if (actionType === 'etl') {
                // ETL Parse
                await runLatestETL(caseNumber);
            } else if (actionType === 'etl_llm') {
                // ETL Parse with LLM
                await runLatestETLWithLLM(caseNumber);    
            } else {
                alert("❌ Unsupported action selected. Please choose a valid option and try again.");
            }
        }

        async function runLatestETL(caseNumber) {
            // Show loading animation and log messages
            showCaseLoading();

            try {
                // Step 1: Submit case number and wait for the server to complete session setup.
                const response = await fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `case_number=${encodeURIComponent(caseNumber)}`
                });

                // Step 2: If successful, redirect to the analysis page.
                if (response.ok) {
                    console.log("✅ Case number POST completed. Redirecting...");
                    window.location.href = '/automation/run_latest_etl';
                } else {
                    throw new Error("Server returned error " + response.status);
                }

            } catch (error) {
                alert('❌ Error occurred: ' + error);
                // Restore the original view if needed.
                document.getElementById('form-box').style.display = 'block';
                hideAllLoadingBoxes();
            }
        }

        // Function to trigger LLM-based ETL analysis
        async function runLatestETLWithLLM(caseNumber) {
            showCaseLoading();

            try {
                const response = await fetch('/start_latest_etl_llm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `case_number=${encodeURIComponent(caseNumber)}`
                });

                const data = await response.json();
                if (!response.ok || !data.success) {
                    throw new Error(data.message || (`Server returned error ${response.status}`));
                }

                window.location.href = data.redirect_url;
            } catch (error) {
                alert('❌ Error occurred: ' + error.message);
                document.getElementById('form-box').style.display = 'block';
                hideAllLoadingBoxes();
            }
        }

        // Auto-fill from clipboard and zero-padding
        document.addEventListener("DOMContentLoaded", () => {
            const input = document.getElementById("case_number");
            const caseSubmitBtn = document.getElementById('case-submit-btn');
            if (!input) {
                return;
            }

            const updateCaseSubmitButtonColor = () => {
                if (!caseSubmitBtn) {
                    return;
                }
                const hasText = input.value.trim().length > 0;
                caseSubmitBtn.classList.toggle('is-ready', hasText);
            };

            // Auto-fill from clipboard
            const autoFillFromClipboard = async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    const trimmed = text.trim();
                    // Check if it's a valid case number (1-8 digits)
                    if (/^\d{1,8}$/.test(trimmed)) {
                        // Auto-pad to 8 digits
                        input.value = trimmed.padStart(8, '0');
                    }
                    updateCaseSubmitButtonColor();
                } catch (err) {
                    // Silently fail - clipboard access denied or not available
                }
            };

            // Try to auto-fill on page load
            autoFillFromClipboard();
            
            // Also try when user focuses the input
            input.addEventListener("focus", autoFillFromClipboard, { once: true });

            // Intercept paste event for auto-padding
            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                const trimmed = pastedText.trim();
                
                if (/^\d{1,8}$/.test(trimmed)) {
                    input.value = trimmed.padStart(8, '0');
                } else {
                    input.value = trimmed;
                }
                updateCaseSubmitButtonColor();
            });

            // Add zero-padding on blur
            input.addEventListener("blur", () => {
                const value = input.value.trim();
                if (value && /^\d{1,8}$/.test(value)) {
                    input.value = value.padStart(8, '0');
                }
                updateCaseSubmitButtonColor();
            });

            // Format on Enter key
            input.addEventListener("keypress", (e) => {
                if (e.key === 'Enter') {
                    const value = input.value.trim();
                    if (value && /^\d{1,8}$/.test(value)) {
                        input.value = value.padStart(8, '0');
                    }
                    updateCaseSubmitButtonColor();
                }
            });

            input.addEventListener('input', updateCaseSubmitButtonColor);
            updateCaseSubmitButtonColor();
        });
        // Tab Switching
        function switchTab(tabName) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected tab content
            if (tabName === 'case-number') {
                document.getElementById('case-number-tab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else if (tabName === 'local-upload') {
                document.getElementById('local-upload-tab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }

        // File Upload Handling
        let selectedFiles = [];

        function handleUploadBarKeydown(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openLocalFileChooser();
            }
        }
        function fileNameFromPath(pathValue) {
            const normalized = String(pathValue || '').replace(/\\/g, '/');
            const parts = normalized.split('/');
            return parts[parts.length - 1] || '';
        }

        async function openLocalFileChooser() {
            try {
                const response = await fetch('/log_parser/pick_local_analysis_file', {
                    method: 'POST'
                });
                const result = await response.json();
                if (!response.ok || !result.success || !result.source_path) {
                    throw new Error(result.message || 'Native picker was cancelled or unavailable.');
                }

                const pickedName = result.filename || fileNameFromPath(result.source_path);
                selectedFiles = [{
                    file: { name: pickedName, size: 0 },
                    sourcePath: result.source_path,
                }];
                updateFileList();
            } catch (error) {
                alert('❌ Native file picker unavailable: ' + error.message);
            }
        }

        function updateFileList() {
            const fileNameLabel = document.getElementById('upload-file-name');
            const submitBtn = document.getElementById('upload-bar-submit-btn');
            
            
            if (selectedFiles.length === 0) {
                if (fileNameLabel) {
                    fileNameLabel.textContent = 'No file selected';
                }
                submitBtn.disabled = true;
                submitBtn.classList.remove('is-ready');
                return;
            }
            
            submitBtn.disabled = false;
            submitBtn.classList.add('is-ready');
            
            const selectedName = selectedFiles[0]?.file?.name || '1 file selected';
            if (fileNameLabel) {
                fileNameLabel.textContent = selectedName;
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
// Submit Local Upload
        async function submitLocalUpload(event) {
            if (event) {
                event.stopPropagation();
            }

            if (selectedFiles.length === 0) {
                alert('⚠️ Please select at least one file!');
                return;
            }

            const formData = new FormData();

            const selectedItem = selectedFiles[0];
            if (!selectedItem || !selectedItem.sourcePath) {
                alert('⚠️ Please use the native picker and select a local file path.');
                return;
            }

            formData.append('source_path', selectedItem.sourcePath);

            // Show local-upload specific loading and connect socket for real-time logs
            showLocalUploadLoading();
            connectUploadProgressSocket();
            
            if (document.getElementById('bsod-checkbox-input').checked) {
                formData.append('is_bsod', 'true');
            }

            try {
                const response = await fetch('/log_parser/upload_local_analysis', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || ('Upload failed with status: ' + response.status));
                }

                disconnectUploadSocket();

                // .log / .etl: mirror the wpp_complete chatbot flow from download_result.html
                if (result.use_chatbot) {
                    try {
                        if (result.etl_path) {
                            // .etl — ETL already parsed server-side; call prepare to prime the agent
                            const prepareRes = await fetch('/log_chatbot/prepare', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ etl_path: result.etl_path })
                            });
                            const prepareData = await prepareRes.json();
                            if (!prepareData.success) {
                                console.warn('Chatbot prepare warning:', prepareData.error);
                            }
                        } else if (result.log_path) {
                            // .log — set the log directly on the agent
                            await fetch('/log_chatbot/set_log', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ log_path: result.log_path })
                            });
                        }
                    } catch (e) {
                        console.warn('Chatbot prepare step failed, navigating anyway:', e);
                    }
                    window.location.href = '/log_chatbot/?auto_run=analyze_all';
                } else if (result.redirect) {
                    window.location.href = result.redirect;
                } else {
                    alert('✅ Analysis completed successfully!');
                    window.location.reload();
                }
            } catch (error) {
                disconnectUploadSocket();
                alert('❌ Error occurred: ' + error.message);
                document.getElementById('tabs-container').style.display = 'block';
                hideAllLoadingBoxes();
            }
        }
    </script>
