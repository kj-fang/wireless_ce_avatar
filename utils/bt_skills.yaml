  expert_rules: |
    Carefully analyze the timeline of events immediately when there is disconnection behavior. Categorize the root cause into one of the following three scenarios based on the log pattern:
    1. If there is UserConfirmationReqNegReply, UserPasskeyReqNegReply or RemoteOOBDataReqNegReply. This indicates the user did not acknowledge or accept the connection. Conclude this is a user behavior to reject the connection.
    2. Sometimes we will observe firmware error which will lead disconnection behavior. It will represent Intel Fatal Exception, Intel System Exception or Hardware Failure.
    3. In the latest disconnection log behavior, try to analyze the possible reason and timing. We will be able to utilize the problem reason and error timing, then clarify the needs through additional Bluetooth snoop or OTA log.

