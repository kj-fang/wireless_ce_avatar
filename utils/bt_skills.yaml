Bluetooth_device_abnormal_disconnected:
  name: "Bluetooth_device_abnormal_disconnected"
  description: "Analyze any unexpected Bluetooth disconnections with possible error information. When we have Bluetooth abnormal disconnection while using LE HID, Classic headset, LE Audio headset or any accessory connected. No matter it's caused by Environment, Accessory problem, Laptop problem or user decline"
