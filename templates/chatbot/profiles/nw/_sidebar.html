<!-- Log file -->
<div class="sidebar-section">
    <h6>📂 Log File</h6>

    <!-- Inner tabs: Wi-Fi Log / Sleepstudy -->
    <div style="display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid #e0e0e0;">
        <button id="logtab-wifi" class="log-subtab active"
                onclick="switchLogTab('wifi')"
                style="flex:1;padding:6px 8px;font-size:0.75rem;font-weight:600;border:none;background:none;color:var(--accent);border-bottom:2px solid var(--accent);cursor:pointer;">
            Wi-Fi Log
        </button>
        <button id="logtab-sleep" class="log-subtab"
                onclick="switchLogTab('sleep')"
                style="flex:1;padding:6px 8px;font-size:0.75rem;font-weight:600;border:none;background:none;color:#888;border-bottom:2px solid transparent;cursor:pointer;">
            Sleepstudy
        </button>
    </div>

    <!-- Wi-Fi log panel -->
    <div id="logpanel-wifi">
        {% if suggested_log %}
        <div style="font-size:0.75rem;background:#1a3a1a;border:1px solid #2d6a2d;border-radius:5px;padding:5px 8px;margin-bottom:6px;color:#7ec87e;">
            ✅ Log from last analysis pre-loaded — click <strong>Load</strong> to confirm.
        </div>
        {% endif %}
        <div class="log-input-group">
            <input id="log-path-input" type="text"
                   placeholder="Full path to .log file…"
                   value="{{ suggested_log | default('', true) }}">
            <button class="btn-browse" onclick="browseLog()" title="Browse for file">📁</button>
            <button class="btn-set-log" onclick="setLog()">Load</button>
        </div>
        <div id="log-status" class="log-status"></div>
    </div>

    <!-- Sleepstudy panel -->
    <div id="logpanel-sleep" style="display:none;">
        <div class="log-input-group">
            <input id="sleepstudy-path-input" type="text"
                   placeholder="Full path to sleepstudy file…">
            <button class="btn-browse" onclick="browseSleepstudy()" title="Browse for file">📁</button>
            <button class="btn-set-log" onclick="setSleepstudy()">Load</button>
        </div>
        <div id="sleepstudy-status" class="log-status"></div>
    </div>
</div>

{% include 'chatbot/_event_log.html' %}

<!-- Skills -->
<div class="sidebar-section">
    <h6>🛠 Available Skills</h6>
    <div id="skills-list">
        <div style="font-size:0.78rem;color:#aaa;">Load a log file to see skills.</div>
    </div>
</div>

<!-- Reload skills from directory -->
<div class="sidebar-section">
    <h6>🛠 Reload Skills</h6>
    <div class="log-input-group">
        <input id="skills-dir-input" type="text" placeholder="Skills data directory…">
        <button class="btn-browse" onclick="browseSkillsDir()" title="Browse for directory">📁</button>
    </div>
    <button class="btn-set-log" style="width:100%;margin-top:6px;" onclick="reloadSkills()">🔄 Reload Skills</button>
    <div id="skills-reload-status" class="log-status"></div>
</div>
