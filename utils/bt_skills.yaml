  expert_rules: |
    Carefully analyze the timeline of events immediately when there is disconnection behavior. Categorize the root cause into one of the following three scenarios based on the log pattern:
    1. If there is UserConfirmationReqNegReply, UserPasskeyReqNegReply or RemoteOOBDataReqNegReply. This indicates the user did not acknowledge or accept the connection. Conclude this is a user behavior to reject the connection.
    2. Sometimes we will observe firmware error which will lead disconnection behavior. It will represent Intel Fatal Exception, Intel System Exception or Hardware Failure.
    3. In the latest disconnection log behavior, try to analyze the possible reason and timing. We will be able to utilize the problem reason and error timing, then clarify the needs through additional Bluetooth snoop or OTA log.


BREDR_and_LE_create_Connection:
  name: "BREDR_and_LE_create_Connection"
  description: "Check the outgoing or incoming connection behavior."
  keywords:
    - "[CMD DEC]CreateConnection"
    - "[CMD DEC]OpCode:               0x0405"
    - "[CMD DEC]AddSCOConnection"
    - "[CMD DEC]OpCode:               0x0407"
    - "SetupSyncConnection"
    - "[CMD DEC]OpCode:               0x0428"
    - "AcceptSyncConnectionReq"
    - "[CMD DEC]OpCode:               0x0429"
    - "EnhancedSetupSyncConnection"
    - "[CMD DEC]OpCode:               0x043D"
    - "EnhancedAcceptSyncConnection"
    - "[CMD DEC]OpCode:               0x043E"
    - "[CMD DEC]AcceptConnectionReq"
    - "[CMD DEC]OpCode:               0x2049"
    - "[CMD DEC]LE_ExtendedCreateConnection"
    - "[CMD DEC]OpCode:               0x2043"
    - "[CMD DEC]LE_CreateConnection"
    - "[CMD DEC]OpCode:               0x200D"
    - "[CMD DEC]LE_RemDevFromWhiteList"
    - "[CMD DEC]OpCode:               0x2012"
    - "LE_LongTermKeyReqReply"
    - "[CMD DEC]OpCode:               0x201A"
    - "[CMD DEC]LE_SetExtAdvParam"
    - "[CMD DEC]OpCode:               0x2036"
    - "LE_SetPeriodicAdvParam"
    - "[CMD DEC]OpCode:               0x203E"
    - "LE_SetExtAdvData"
    - "[CMD DEC]OpCode:               0x2037"
    - "LE_SetExtAdvEnable"
    - "[CMD DEC]OpCode:               0x2039"
    - "LE_SetPeriodicAdvData"
    - "[CMD DEC]OpCode:               0x203F"
    - "LE_SetPeriodicAdvEnable"
    - "[CMD DEC]OpCode:               0x2040"
    - "LE_SetCigParameters"
    - "[CMD DEC]OpCode:               0x2062"
    - "LE_CreateCis"
    - "[CMD DEC]OpCode:               0x2064"
    - "LE_AcceptCisRequest"
    - "[CMD DEC]OpCode:               0x2066"
    - "LE_Create_BIG"
    - "[CMD DEC]OpCode:               0x2068"
    - "LE_BIG_Create_Sync"
    - "[CMD DEC]OpCode:               0x206B"
    - "LE_Setup_ISO_Data_Path"
    - "[CMD DEC]OpCode:               0x206E"
    - "ReadLocalSupportedCodecs"
    - "[EVT DEC]ConnectionCompl"
    - "ConnectionReq"
    - "LE_ConnComplete"
    - "LE_EnhancedConnComplete"
    - "LE_CIS_Established"
    - "SyncConnectionCompl"
    - "[EVT DEC]Status:               0x00 (OK)"
  expert_rules: |
    1. Clarify the latest connection info includes CreateConnection over BREDR connection or LE_CreateConnection over LE connection. 
    2. In Bluetooth LE Audio connection usage, we will observe the flow with below items.
        [CMD DEC]LE_ExtendedCreateConnection
        [CMD DEC]OpCode:               0x2043
        [EVT DEC]LE_EnhancedConnComplete
        [EVT DEC]Status:               0x00 (OK)
        [CMD DEC]CreateConnection
        [CMD DEC]OpCode:               0x0405
        [EVT DEC]ConnectionCompl
        [EVT DEC]Status:               0x00 (OK)
        ReadLocalSupportedCodecs
        LE_SetCigParameters
        [CMD DEC]OpCode:               0x2062
        LE_CreateCis
        [CMD DEC]OpCode:               0x2064
        LE_Setup_ISO_Data_Path
        [CMD DEC]OpCode:               0x206E
    3. In Bluetooth LE Audio Auracast or "Shared Audio" usage, we will observe the flow with below items.
        [CMD DEC]LE_SetExtAdvParam
        [CMD DEC]OpCode:               0x2036
        LE_SetPeriodicAdvParam
        [CMD DEC]OpCode:               0x203E
        LE_SetExtAdvData
        [CMD DEC]OpCode:               0x2037
        LE_SetPeriodicAdvData
        [CMD DEC]OpCode:               0x203F
        LE_SetPeriodicAdvEnable
        [CMD DEC]OpCode:               0x2040
        LE_SetExtAdvEnable
        [CMD DEC]OpCode:               0x2039
        LE_Create_BIG
        [CMD DEC]OpCode:               0x2068
        LE_Setup_ISO_Data_Path
        [CMD DEC]OpCode:               0x206E
    4. In Bluetooth LE HID connection usage, we will observe the flow with below items.
        [CMD DEC]LE_ExtendedCreateConnection
        [EVT DEC]LE_EnhancedConnComplete
    5. In device is removed by end user, we will have below information.
        [EVT DEC]LE_RemDevFromWhiteList
    6. In Bluetooth Classic headset connection usage, we will observe the flow with below items.
        [CMD DEC]CreateConnection
        [EVT DEC]ConnectionCompl
        [EVT DEC]Status:               0x00 (OK)

Bluetooth_device_YB_Lost:
  name: "Bluetooth_device_YB_Lost"
  description: "Analyze any unexpected driver or FW error which leads Bluetooth device crash in OS mode"
  keywords:
    - "SYSTEM EXCEPTION Occurred in Controller"
    - "FATAL EXCEPTION Occurred in Controller"
    - "Error!! Wifi  rejected PLDR request, Transitioning to YB!"
    - "Entering device state D3 Final"
    - "Error! Received unexpected alive interrupt"
    - "HardwareError"
    - "HW Error detected"
    - "Force Recovery from D0"
    - "CSR_F2D_MBX_1: 0xBADBAD"
    - "[CSR_F2D_MBX_1]: 0x01BADBAD"
    - "[CSR_F2D_MBX_1]: 0x02BADBAD"
    - "Error! Received unexpected alive interrupt"
    - "Error! DMA failed."
    - "FdoEvtDeviceReleaseHardware"
    - "BtPdoEvtDeviceReleaseHardware"
    - "Signature Verification Failed"
    - "Error: BT Shared Hw Reset fail."
    - "WdfDmaEnblerCreate failed"
    - "FwDownloadSFIBurst failed"
    - "Error! Received unexpected HW Rfkill Ack (GP2) interrupt"
    - "Report YB"
    - "Recovery is disabled in registry"
    - "Nothing to do since Reset/Surprise removal is pending or Recovery is performed"
    - "BtFdEvtDeviceSurpriseRemoval"
    - "Do not report USB errors"
    - "DriverUnload"
    - "STATUS_NO_SUCH_DEVICE"
    - "Transitioning to YB"
    - "Force to YB"
    - "Device is YB"
    - "Reporting YB"
    - "Transition to YB"
    - "let it YB"
    - "Inform Upper driver stack and YB"
    - "Forcerecovery:"
    - "IBtPciHandleHwErrorEvent"
    - "HandleFwException Failed"
    - "STATUS_TIMEOUT"
    - "BtPciPerformErrorRecovery"
    - "STATUS_IO_TIMEOUT"
    - "Entering device state D3 Final"
    - "USBD_STATUS_XACT_ERROR"
    - "Failed to validate Secure Send Result event"
    - "DownloadAllFwImages failed"
    - "PerformSharedHwReset failed"
    - "Error: BT Shared Hw Reset fail"
    - "Error: BT SHR Failed in InitializeAdapter"
  expert_rules: |
    1. If the design pass schematic review and layout review, we also need to confirm the problem is not single or specific unit. This indicates it is low risk on HW design related.
    2. We would expect proper PLDR, FLR and product reset without problem. It will guarantee the fundamental function for error recovery.
    3. Match the latest error timing and analyze the possible problem information to disclose the finding.