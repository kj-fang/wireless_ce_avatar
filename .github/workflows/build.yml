# Scenario 1: Developer PR  → feature branch pushed, PR opened against main
#   - Builds + runs linter, uploads artifact, posts version comment on PR
#   - Version: 99.0.<base_patch>-dev.<sha1>  (DEV)
#
# Scenario 2: Merge to main  → PR merged (push to main)
#   - Nightly build, uploads artifact, NO GitHub Release
#   - Version: 99.0.<commit_count>  (NIGHTLY)

name: Build and Test

on:
  push:
    branches: [ main ]         # Scenario 2: nightly after merge
  pull_request:
    branches: [ main ]         # Scenario 1: dev PR build
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write        # needed to post PR comments

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for commit count
        # For PRs, check out the actual branch tip (not the auto-generated merge commit
        # that GitHub creates). This ensures git rev-parse HEAD returns the real PR commit
        # SHA, and git merge-base correctly finds the branch point on main.
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Calculate version from git
      id: version
      run: |
        git fetch origin main --no-tags 2>$null

        $gitHash   = git rev-parse --short HEAD
        $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
        $isNightly = ("${{ github.event_name }}" -eq "push") -and ("${{ github.ref }}" -eq "refs/heads/main")

        if ($isNightly) {
          # Scenario 2: Merge to main — nightly build
          $commitCount = git rev-list --count HEAD
          $version     = "99.0.$commitCount"
          $buildType   = "NIGHTLY"
        } else {
          # Scenario 1: PR from feature branch — dev build
          # Anchor patch to the commit count on main at the branch point so the dev
          # version number clearly identifies which nightly it was branched from.
          $mergeBase = git merge-base HEAD origin/main 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $mergeBase) {
            $baseCommitCount = git rev-list --count origin/main
            Write-Host "::warning::Could not determine branch point — using tip of main as fallback"
          } else {
            $baseCommitCount = git rev-list --count $mergeBase
          }
          $version   = "99.0.$baseCommitCount-dev.$gitHash"
          $buildType = "DEV"
        }

        echo "VERSION=$version"      >> $env:GITHUB_OUTPUT
        echo "GIT_HASH=$gitHash"     >> $env:GITHUB_OUTPUT
        echo "BUILD_DATE=$buildDate" >> $env:GITHUB_OUTPUT
        echo "BUILD_TYPE=$buildType" >> $env:GITHUB_OUTPUT

        Write-Host "Build Type : $buildType"
        Write-Host "Version    : $version"
        Write-Host "Git Hash   : $gitHash"
    
    - name: Update version files
      run: |
        # Update version.py
        $versionContent = @"
        """
        Version information for IntelAvatar.
        This file is auto-generated by the build script.
        """
        
        __version__ = "${{ steps.version.outputs.VERSION }}"
        BUILD_DATE = "${{ steps.version.outputs.BUILD_DATE }}"
        GIT_HASH = "${{ steps.version.outputs.GIT_HASH }}"
        GIT_BRANCH = "main"
        "@
        
        Set-Content -Path "configs/version.py" -Value $versionContent -Encoding UTF8
        
        # Update version_info.txt
        $version = "${{ steps.version.outputs.VERSION }}"
        $gitHash = "${{ steps.version.outputs.GIT_HASH }}"
        $buildDate = "${{ steps.version.outputs.BUILD_DATE }}"
        # Strip -dev.<sha1> suffix for the numeric tuple (Windows exe metadata requires numbers only)
        $numericVersion = $version -replace '-dev\..+$', ''
        $versionParts = $numericVersion -split '\.'
        $major = $versionParts[0]
        $minor = $versionParts[1]
        $patch = if ($versionParts.Length -gt 2 -and $versionParts[2]) { $versionParts[2] } else { "0" }
        
        $versionInfoContent = @"
        # UTF-8
        VSVersionInfo(
          ffi=FixedFileInfo(
            filevers=($major, $minor, $patch, 0),
            prodvers=($major, $minor, $patch, 0),
            mask=0x3f,
            flags=0x0,
            OS=0x40004,
            fileType=0x1,
            subtype=0x0,
            date=(0, 0)
            ),
          kids=[
            StringFileInfo(
              [
              StringTable(
                u'040904B0',
                [StringStruct(u'CompanyName', u'Intel Corporation'),
                StringStruct(u'FileDescription', u'IntelAvatar - Wireless CE Log Analysis Tool'),
                StringStruct(u'FileVersion', u'$version.0'),
                StringStruct(u'InternalName', u'IntelAvatar'),
                StringStruct(u'LegalCopyright', u'Copyright © 2026 Intel Corporation'),
                StringStruct(u'OriginalFilename', u'IntelAvatar.exe'),
                StringStruct(u'ProductName', u'IntelAvatar'),
                StringStruct(u'ProductVersion', u'$version.0'),
                StringStruct(u'Comments', u'Git: $gitHash | Build: $buildDate')])
              ]), 
            VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
          ]
        )
        "@
        
        Set-Content -Path "version_info.txt" -Value $versionInfoContent -Encoding UTF8
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      
    - name: Run linter (optional)
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Build with PyInstaller
      run: |
        pip install pyinstaller
        pyinstaller IntelAvatar.spec
    
    - name: Rename exe with version
      run: |
        # Both DEV and NIGHTLY include enough info in the version string:
        #   DEV     → IntelAvatar_v99.0.312-dev.abc1234.exe  (sha embedded)
        #   NIGHTLY → IntelAvatar_v99.0.315_abc1234.exe      (sha appended)
        $version   = "${{ steps.version.outputs.VERSION }}"
        $gitHash   = "${{ steps.version.outputs.GIT_HASH }}"
        $buildType = "${{ steps.version.outputs.BUILD_TYPE }}"
        $exeName   = if ($buildType -eq "NIGHTLY") {
          "IntelAvatar_v${version}_${gitHash}.exe"
        } else {
          "IntelAvatar_v${version}.exe"
        }
        Move-Item -Path "dist/IntelAvatar/IntelAvatar.exe" -Destination "dist/IntelAvatar/$exeName" -Force

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: IntelAvatar-${{ steps.version.outputs.BUILD_TYPE }}-${{ steps.version.outputs.VERSION }}
        path: dist/
        retention-days: 14

    # Post a PR comment with the dev build info (Scenario 1 only)
    - name: Comment PR with build info
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ Build successful!

**Dev Version:** \`${{ steps.version.outputs.VERSION }}\`
**Commit:** \`${{ steps.version.outputs.GIT_HASH }}\`
**Build Date:** ${{ steps.version.outputs.BUILD_DATE }}

📥 [Download artifact](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
          })
