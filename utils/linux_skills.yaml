    - "queue"
    - "ring buffer"
    - "init ucode"
    - "operational ucode"
    - "loaded ucode"
    - "Loaded ucode"
    - "Detected Intel"
    - "Intel Wi-Fi"
  expert_rules: |
    Examine the driver and hardware initialization sequence:
    1. Verify that the firmware blob was found and loaded successfully.
    2. Check for PCI enumeration errors or resource allocation failures.
    3. Look for NVM (EEPROM/OTP) read failures that produce incorrect calibration or channel maps.
    4. Identify if the driver loaded successfully through the full init → operational ucode sequence.
    5. Check for hardware version mismatches between the firmware and the physical device.

thermal_and_rfkill:
  name: "thermal_and_rfkill"
  description: "Detect RF kill events (hardware/software), thermal throttling, and SAR limit changes that disable or degrade WiFi radio operation."
  keywords:
    - "rfkill"
    - "RFKILL"
    - "RF kill"
    - "radio disabled"
    - "radio enabled"
    - "Kill switch"
    - "airplane mode"
    - "thermal"
    - "thermal throttle"
    - "SAR"
    - "WRDS"
    - "EWRD"
    - "WGDS"
    - "temperature"
    - "overheat"
    - "ACPI"
    - "hw rfkill"
    - "sw rfkill"
    - "blocked"
    - "unblocked"
    - "Host command sent while RFKILL"
    - "cannot TX while RFKILL"
  expert_rules: |
    Analyze RF kill and thermal events:
    1. Identify whether the rfkill is hardware-triggered (physical switch/BIOS) or software-triggered (OS/supplicant).
    2. For hardware rfkill: check ACPI/BIOS events that may toggle the radio (e.g. airplane mode key, thermal policy).
    3. For thermal events: verify whether the SAR/WRDS/EWRD table is being applied and if it is causing excessive TX power reduction.
    4. Confirm that rfkill events are followed by a proper radio re-enable sequence.
    5. Check if frequent rfkill toggles are causing connectivity instability.
