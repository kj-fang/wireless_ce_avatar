    Brief evidence from the log
    3. Log show "PLDR is supported in this platform" or "BT Internal PLDR supported on this platform" means PLDR is supported.
    4. Log show "PLDR is not supported in this platform" means PLDR is not config correctly to support bluetooth error recovery.
    5. "Warning!! Handle PLDR triggered by Wifi" means WIFI trigger product and bluetooth is await for reload.
    6. "Recovery is already in progress" means PLDR had been triggered by others mechanism.
    7. Interpretation: “Error!! Product reset rejected” means the BT PLDR request was rejected by WiFi"
    This event should be analyzed using both status code and reject reason code.
    Status codes:
    0 = reset started
    1 = reset rejected
    Reject reason codes:
    0 = irrelevant / no specific reject reason
    1 = product reset not supported
    2 = power transition in progress
    3 = WiFi returned NACK response
    4 = WiFi reached maximum PLDR attempts
    Analysis goal:

    Determine whether the PLDR was started or rejected.
    If rejected, identify the reject reason and explain it in plain language.
    Use the status code and reason code together to judge whether this is normal behavior or a problem.
    8. "Error: BT SHR Failed, As this is Product reset.. no mitigation" means BT SHR (share reset) failed, and no mitigation on this case.

Bluetooth_Audio:
  name: "Bluetooth_Audio"
  description: "Review Bluetooth Audio , Audio offload config , Discrete offload , and platform audio config correctness."
  keywords:
    - "DriverEntry"
    - "audio offload"
    - "EnableLEAudioBroadcast"
    - "IbtPciSelectAudioInterfaceCmd"
    - "ibtPciQueryIntelExtendedAudioOffloadFeatureSupport"
    - "Hf offload"
    - "A2dp Offload"
    - "IbtpciBthFdQueryAcpiAudOffloadConfig"
    - "AOLD"
    - "IoCallDriver failed"
    - "NHLT"
    - "AUD_OFF_ACPI"
    - "DLOA"
    - "BtFdReadUefiAudioConfig"
    - "BthFdQueryAcpiAudOffloadConfig"
    - "Attempting to query"
    - "Sco Support Type"
  expert_rules: |
    1. Analyze Bluetooth DriverEntry logs.

    Rules:

    DriverEntry means a real driver load and initialization event.
    DriverEntry is a one-time log per load cycle, shown only when the driver is actually initialized.
    Normal Bluetooth re-initialization should not print DriverEntry again unless the driver was reloaded.
    If DriverEntry is present, the log window contains first-load platform init context such as build number, version, signer type, OS build, and ETW registration status.
    If DriverEntry is absent, do not assume platform init details are available in that window.
    DriverEntry during a user cold boot is normal and not a problem.
    DriverEntry during a platform PLDR flow may indicate recovery behavior, so check whether Bluetooth needed PLDR recovery.
    DriverEntry presence alone is not a failure. Judge it together with boot type, PLDR indicators, and surrounding recovery logs.
    Output:

    DriverEntry present or absent
    Likely scenario: cold boot / PLDR recovery / normal reload / unclear
    Whether this suggests a problem or normal behavior
    Brief evidence from the log
    2. "Hf offload support is available in firmware" and "A2dp Offload support is available in firmware" only means bluetooth firmware audio offload capability available , it does not means the audio offload feature get enabled.
    3. Analyze Intel Bluetooth driver logs for ACPI/DSM method checks.

    Goal:
    Find which method failed with 0xc0000034 (STATUS_OBJECT_NAME_NOT_FOUND).

    Method map:

    49414c47 = GuidLockIndicator ACPI method
    444c4f41 = Audio offload BIOS ACPI method
    43535442 = BT SmartThings ACPI method
    53444153 = Antenna diversity BIOS ACPI method
    4d53445f = BIOS PLDR Duration DSM method
    Rules:

    Identify each method from log lines like “Attempting to query ACPI method <hex>” or “Attempting to query ACPI DSM method <hex>”.
    For each method block, if any line contains 0xc0000034 or STATUS_OBJECT_NAME_NOT_FOUND, mark it FAIL.
    If the block ends with STATUS_SUCCESS and no 0xc0000034 appears, mark it PASS.
    Output the result for each method as: Method <hex> (<feature name>): PASS/FAIL
    If FAIL, include the exact evidence line with 0xc0000034.
    Final line:
    Failed method(s): ...
    Or: No 0xc0000034 failures detected
    Severity:

    49414c47 and 43535442 failures are not real issues.
    444c4f41 and 4d53445f failures are P0 critical issues.
    Samsung rule:

    Only mention SmartThings details for 43535442 if the platform is confirmed Samsung.
    If Samsung is not confirmed, hide all SmartThings-related output completely.
    4. "Audio offload configuration is NOT supported" , "Audio offload registry key value set to 0" , or "Audio offload configuration is NOT present" means driver was not able to enable on audio offload.
    5. NHLT Bluetooth role configuration.

    This configuration comes from the NHLT side, not from BIOS.
    It defines the Bluetooth I2S clock role in the audio topology.
    Meaning of the values,
    0x0 = Bluetooth offload is disabled
    0x1 = Bluetooth is the I2S clock master
    0x2 = Bluetooth is the I2S clock slave
    This setting determines whether Bluetooth or the Audio DSP acts as master, and the other side acts as slave.
    BIOS alignment rule.There is a separate BIOS-side configuration for the same Bluetooth/audio role.The BIOS configuration must align with the NHLT configuration.If the two sides do not match, treat it as a configuration mismatch and investigate the platform setup.
    6. [BthFdQueryAcpiAudOffloadConfig]Method[0] and [UtilHCIDump][AUD_OFF_ACPI] 00 00 00 00 , means Revision = 0 , this information is from acpi method AOLD/DLOA.
    7. [BthFdQueryAcpiAudOffloadConfig]Method[1] and [UtilHCIDump][AUD_OFF_ACPI] 12 00 00 00 , it means Domain Type = 0x12（Bluetooth）, this information is from acpi methid AOLD/DLOA.
    8. [BthFdQueryAcpiAudOffloadConfig]Method[2] and ][UtilHCIDump][AUD_OFF_ACPI] 03 00 00 00 , it means  BT Audio Offload Sel = 0x03（Audio offload enabled I2S）, this information is from acpi methid AOLD/DLOA.
    9. Bluetooth audio offload , AOLD UEFI name is UefiCnvBtAOLD , and AOLD UUID is 42780DD5-9A7D-404C-80E4-7F7094360394
    10. Bluetooth audio offload , BT NHLT UEFI name is NhltBtConfigurationVariable , and UUID is B2364F9C-B817-4750-A5D2-37A0D1DAF8DD

    11. "[BthFdQueryAcpiAudOffloadConfig]Audio offload configuration is supported" , and "[BthFdQueryAcpiAudOffloadConfig]Audio offload is supported and enabled" , and "[BthFdQueryAcpiAudOffloadConfig]Audio offload registry key value set to 2" means audio offload enabled normally.
