    - "Link Key Can Not be Changed"
    - "Requested QoS Is Not Supported"
    - "Instant Passed"
    - "Pairing With Unit Key Not Supported"
    - "Different Transaction Collision"
    - "Insufficient Resources To Accept Scatter Mode Request"
    - "QoS Unacceptable Parameter"
    - "Unacceptable Connection Parameters"
    - "QoS Rejected"
    - "Channel Classification Not Supported"
    - "Insufficient Security"
    - "Parameter Out Of Mandatory Range"
    - "Scatter Mode No Longer Required"
    - "Role Switch Pending"
    - "Scatter Mode Parameter Change Pending"
    - "Reserved Slot Violation"
    - "Role Switch Failed"
    - "Inquiry Response Data too large for FEC encoding"
