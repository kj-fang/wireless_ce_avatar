    1. Clarify the latest connection info includes CreateConnection over BREDR connection or LE_CreateConnection over LE connection.
    2. In Bluetooth LE Audio connection usage, we will observe the flow with below items.
        [CMD DEC]LE_ExtendedCreateConnection
        [CMD DEC]OpCode:               0x2043
