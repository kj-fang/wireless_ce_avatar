    If Samsung is not confirmed, hide all SmartThings-related output completely.
    2. Analyze Bluetooth DriverEntry logs.

    Rules:

    DriverEntry means a real driver load and initialization event.
    DriverEntry is a one-time log per load cycle, shown only when the driver is actually initialized.
    Normal Bluetooth re-initialization should not print DriverEntry again unless the driver was reloaded.
    If DriverEntry is present, the log window contains first-load platform init context such as build number, version, signer type, OS build, and ETW registration status.
